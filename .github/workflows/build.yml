name: Build ImmortalWrt BPI‑R4‑Pro‑8X

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu‑22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Init build env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt‑get update
          sudo apt‑get install -y build‑essential gcc g++ binutils flex bison gawk autoconf automake libtool make cmake git curl wget unzip libssl‑dev python3‑distutils python3‑setuptools python3‑requests file rsync

      - name: Clone ImmortalWrt source
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a

      - name: Add extra feeds (Argon、5G模组插件)
        run: |
          cd openwrt
          cat >> feeds.conf.default <<EOF
          src‑git argon https://github.com/jerrykuku/luci‑theme‑argon.git
          src‑git modem https://github.com/4IceG/luci‑app‑3ginfo‑modem.git
          src‑git quectel https://github.com/4IceG/Modem‑Support.git
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config for BPI‑R4‑Pro‑8X
        run: |
          cd openwrt
          make defconfig
          cat > .config <<EOF
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_mt7988=y
CONFIG_TARGET_mediatek_mt7988_DEVICE_bananapi_bpi‑r4‑pro‑8x=y

# 简体中文
CONFIG_LUCI_LANG_zh‑cn=y

# Argon主题
CONFIG_PACKAGE_luci‑theme‑argon=y
CONFIG_PACKAGE_luci‑theme‑argon‑config=y

# BPI‑BE14 MT7996 WiFi7支持
CONFIG_PACKAGE_kmod‑mt7996=y
CONFIG_PACKAGE_firmware‑mt7996=y
CONFIG_PACKAGE_wpad‑full=y

# USB 5G模组基础支持
CONFIG_PACKAGE_kmod‑usb‑serial=y
CONFIG_PACKAGE_kmod‑usb‑serial‑option=y
CONFIG_PACKAGE_kmod‑usb‑net‑qmi_wwan=y
CONFIG_PACKAGE_kmod‑usb‑net‑rndis=y
CONFIG_PACKAGE_kmod‑usb‑ohci=y
CONFIG_PACKAGE_kmod‑usb‑ehci=y
CONFIG_PACKAGE_kmod‑usb‑xhci=y

# PCIE 5G模组支持
CONFIG_PACKAGE_kmod‑pci=y
CONFIG_PACKAGE_kmod‑pcie‑mt7622=y

# 5G模组管理插件 luci‑app‑3ginfo‑modem（同时支持USB+PCIe模组）
CONFIG_PACKAGE_luci‑app‑3ginfo‑modem=y
CONFIG_PACKAGE_3ginfo‑modem=y
CONFIG_PACKAGE_modem‑support=y
CONFIG_PACKAGE_qmicli=y
CONFIG_PACKAGE_uqmi=y
CONFIG_PACKAGE_mbim‑utils=y
CONFIG_PACKAGE_libmbim=y

# 基础工具
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_openssh‑server=y
CONFIG_PACKAGE_iperf3=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_wget=y
CONFIG_PACKAGE_tcpdump=y

# 关闭不需要的，减小体积
CONFIG_PACKAGE_luci‑theme‑bootstrap=y is not set
EOF
          make defconfig
          ./scripts/diffconfig.sh > diffconfig

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload firmware artifact
        uses: actions/upload‑artifact@v4
        with:
          name: BPI‑R4‑Pro‑8X‑ImmortalWrt
          path: openwrt/bin/targets/mediatek/mt7988/*.img*
