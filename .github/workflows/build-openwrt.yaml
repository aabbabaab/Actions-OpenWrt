name: Build ImmortalWrt 24.10

on:
  workflow_dispatch:
    inputs:
      REPO_URL:
        description: '源码仓库'
        required: false
        default: 'https://github.com/immortalwrt/immortalwrt'
      REPO_BRANCH:
        description: '源码分支'
        required: false
        default: 'immortalwrt-24.10'
      FEED_CONF:
        description: 'feeds配置文件'
        required: false
        default: 'feeds.conf.default'

jobs:
  build:
    runs-on: ubuntu‑22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt‑get update
          sudo apt‑get -y install build‑essential asciidoc binutils bzip2 gawk gettext git libncurses5‑dev libz‑dev patch python3 python3‑yaml python3‑distutils unzip zlib1g‑dev lib32gcc‑s1 libc6‑dev‑i386 subversion flex uglifyjs git‑core gcc‑multilib p7zip p7zip‑full msmtp libssl‑dev texinfo libglib2.0‑dev xmlto qemu‑utils upx libelf‑dev autoconf automake libtool autopoint device‑tree‑compiler g++‑multilib antlr3 gperf wget curl rsync
          sudo apt install -y liblzma‑dev libbz2‑dev libreadline‑dev libsqlite3‑dev
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Clone ImmortalWrt‑24.10 source
        run: |
          git clone ${{ github.event.inputs.REPO_URL }} openwrt -b ${{ github.event.inputs.REPO_BRANCH }} --depth 1
          cd openwrt
          echo "SOURCE_COMMIT: $(git rev‑parse --short HEAD)"

      - name: Update feeds
        run: |
          cd openwrt
          cp ../${{ github.event.inputs.FEED_CONF }} feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom .config
        run: |
          cd openwrt
          cp ../.config .config
          make defconfig

      - name: Run diy‑part1.sh
        run: |
          if [ -f ../diy‑part1.sh ];then
            chmod +x ../diy‑part1.sh
            bash ../diy‑part1.sh
          fi

      - name: Run diy‑part2.sh
        run: |
          if [ -f ../diy‑part2.sh ];then
            chmod +x ../diy‑part2.sh
            bash ../diy‑part2.sh
          fi

      - name: Download source packages
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc)

      - name: Upload firmware artifact
        uses: actions/upload‑artifact@v4
        with:
          name: ImmortalWrt24.10‑BPI‑R4‑PRO‑8X
          path: openwrt/bin/targets/*/*/*.img*
          retention‑days: 7
